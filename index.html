<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Omar AI - اربح من الانتظار</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:system-ui;text-align:center;padding:8px}
.box{background:#111;padding:12px;border-radius:14px;max-width:520px;margin:8px auto;border:1px solid #00ffcc}
textarea{width:96%;padding:12px;border-radius:10px;background:#222;color:#fff;border:1px solid #00ffcc}
.btn{width:96%;padding:13px;border:none;border-radius:25px;font-weight:bold;margin:6px}
.btn-gen{background:#00ffcc;color:#000}
.btn-ad{background:#ffeb3b;color:#000;animation:pulse 1s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.03)}100%{transform:scale(1)}}
img{width:96%;border-radius:12px;margin:10px auto;display:block;min-height:250px;background:#111}
.ad-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.95);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:999;padding:20px}
.ad-box{background:#161616;border:2px solid #00ffcc;border-radius:20px;padding:20px;max-width:380px;width:90%}
.timer{font-size:28px;color:#00ffcc;font-weight:bold;margin:10px}
</style>
</head>
<body>

<div class="box" style="display:flex;justify-content:space-between">
<span style="color:#00ffcc">🤖 Omar AI - اربح 💰</span>
<span id="cred" style="background:#00ffcc;color:#000;padding:4px 10px;border-radius:12px">3</span>
</div>

<div class="box">
<textarea id="prompt" rows="2">قطة جميلة</textarea>
<button class="btn btn-gen" id="genBtn" onclick="generate()">✨ ولد الصورة</button>
<p id="status" style="font-size:12px;color:#00ffcc"></p>
</div>

<div id="result" class="box" style="display:none">
<img id="genImg" style="width:100%">
</div>

<!-- اعلان الانتظار البجيب قروش -->
<div id="adOverlay" class="ad-overlay">
<div class="ad-box">
<h3 style="color:#00ffcc;margin:5px">🎬 انتظر 45 ثانية - واربح</h3>
<p style="font-size:12px;color:#aaa">شاهد الاعلان اثناء الانتظار لدعم التطبيق مجاناً</p>
<div class="timer" id="adTimer">45</div>
<button class="btn btn-ad" id="adClickBtn" onclick="clickAd()">👆 اضغط هنا لفتح الاعلان واربح 💰</button>
<p id="adClickedStatus" style="font-size:11px;color:#0f0"></p>
<button id="continueBtn" style="display:none" class="btn btn-gen" onclick="closeAd()">✅ متابعة - الصورة جاهزة</button>
<p style="font-size:10px;color:#666">الاعلان يفتح في صفحة جديدة - ارجع هنا بعد الضغط</p>
</div>
</div>

<script>
const AD_LINK="https://asiafilm.org/4/75b0210cfca5e17b2ff21efe527a9072";
let credits=3;
let adClicked=false;
let cooldownActive=false;

async function trans(text){
 try{let r=await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=en&dt=t&q="+encodeURIComponent(text));let d=await r.json();return d[0][0][0];}catch(e){return text;}
}

async function generate(){
 if(cooldownActive){document.getElementById('adOverlay').style.display='flex'; return;}
 let t=document.getElementById('prompt').value.trim(); if(!t) return;
 document.getElementById('status').innerText='⏳ بولد...';
 let en=await trans(t);
 let safe = en.replace(/beautiful|sexy/gi,'cute') + ", cute, 4k, safe";
 let url="https://image.pollinations.ai/prompt/"+encodeURIComponent(safe)+"?width=512&height=512&model=flux&seed="+Date.now()+"&nologo=true&nofeed=true";
 document.getElementById('result').style.display='block';
 let img=document.getElementById('genImg');
 img.src=url;
 img.onload=()=>{document.getElementById('status').innerText='✅ تم!'; startAdCooldown();};
 img.onerror=()=>{document.getElementById('status').innerText='❌ حاول تاني';}
}

function startAdCooldown(){
 cooldownActive=true;
 document.getElementById('adOverlay').style.display='flex';
 adClicked=false;
 document.getElementById('adClickedStatus').innerText='';
 document.getElementById('continueBtn').style.display='none';
 document.getElementById('adClickBtn').style.display='block';
 
 let sec=45;
 document.getElementById('adTimer').innerText=sec;
 let iv=setInterval(()=>{
  sec--;
  document.getElementById('adTimer').innerText=sec;
  if(sec<=0){
   clearInterval(iv);
   cooldownActive=false;
   document.getElementById('adTimer').innerText='✅';
   document.getElementById('continueBtn').style.display='block';
   document.getElementById('adClickBtn').innerText='🎉 شكراً لدعمك - متابعة';
  }
 },1000);
}

function clickAd(){
 adClicked=true;
 window.open(AD_LINK,'_blank');
 document.getElementById('adClickedStatus').innerText='✅ شكراً! ربحت من ضغطتك - انتظر العداد';
 document.getElementById('adClickBtn').style.background='#00ffcc';
 document.getElementById('adClickBtn').innerText='✅ تم الضغط - شكراً 💰';
}

function closeAd(){
 document.getElementById('adOverlay').style.display='none';
}
</script>
</body>
</html>
