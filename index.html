<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Omar AI - حقيقي</title><style>body{background:#0a0a0a;color:#fff;font-family:system-ui;text-align:center;padding:20px}input{width:90%;padding:14px;border-radius:12px;background:#222;color:#fff;border:2px solid #333}button{width:92%;padding:15px;margin:10px;background:#05F2DB;color:#000;border:none;border-radius:12px;font-weight:bold;font-size:17px}img{width:100%;max-width:600px;border-radius:14px;margin:15px 0;display:none}</style></head><body>
<h2>🤖 Omar AI - توليد حقيقي</h2>
<input id="prompt" value="ولد سوداني ماشي في شوارع عطبرة">
<button onclick="generate()">🎬 ولد صورة حقيقية 🚀</button>
<p id="status"></p>
<img id="img">
<script>
async function generate(){
  let p=document.getElementById('prompt').value;
  let s=document.getElementById('status'), img=document.getElementById('img');
  s.innerText="⏳ بولد حقيقي... 15 ثانية";
  img.style.display="none";
  let res=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:p})});
  let data=await res.json();
  if(data.image){ img.src=data.image; img.style.display="block"; s.innerText="✅ اتولد حقيقي!"; }
  else{ s.innerText="❌ خطأ: "+data.error; }
}
</script></body></html>
