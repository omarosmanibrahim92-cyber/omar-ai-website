<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Omar Video - شغال</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:system-ui;text-align:center;padding:10px}
h1{color:#05F2DB}
.card{background:#111;padding:18px;border-radius:18px;max-width:480px;margin:15px auto}
input{width:92%;padding:14px;border-radius:12px;background:#222;color:#fff;border:1px solid #333}
button{width:96%;padding:15px;border:none;border-radius:12px;font-weight:bold;margin:10px 0;font-size:17px;background:#05F2DB;color:#000}
iframe{width:100%;height:250px;border-radius:14px;margin:14px 0;border:0;background:#111}
</style>
</head>
<body>
<h1>🎬 Omar AI Video</h1>
<div class="card">
<input id="q" placeholder="اكتب: قطة، كلب، سيارة، طبيعة، بحر...">
<button onclick="getV()">جيب فيديو من يوتيوب ▶️</button>
<p id="s" style="color:#05F2DB"></p>
<iframe id="v" src="https://www.youtube.com/embed/jNQXAC9IVRw" allowfullscreen></iframe>
</div>
<script>
function getV(){
let q=document.getElementById('q').value.toLowerCase();
let s=document.getElementById('s');
let v=document.getElementById('v');
s.innerText="⏳ بجيب ليك...";
let cat="https://www.youtube.com/embed/hY7m5jjJ9mM";
let dog="https://www.youtube.com/embed/mRf3-Jkw1dQ";
let car="https://www.youtube.com/embed/6_5o3r3cP1k";
let nature="https://www.youtube.com/embed/BHACKCNDMW8";
let sea="https://www.youtube.com/embed/6p0hXm1w7aA";
if(q.includes("قط")||q.includes("cat")||q.includes("أسد")||q.includes("lion")) v.src=cat+"?autoplay=1";
else if(q.includes("كلب")||q.includes("dog")) v.src=dog+"?autoplay=1";
else if(q.includes("سيار")||q.includes("car")||q.includes("عرب")) v.src=car+"?autoplay=1";
else if(q.includes("بحر")||q.includes("sea")||q.includes("ocean")) v.src=sea+"?autoplay=1";
else v.src=nature+"?autoplay=1";
s.innerText="✅ فيديو شغال هسي من يوتيوب!";
}
</script>
</body>
</html>
