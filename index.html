<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Omar AI - بدون Limit</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:system-ui;text-align:center;padding:10px}
h1{color:#05F2DB;font-size:19px}
.card{background:#111;padding:14px;border-radius:18px;max-width:620px;margin:auto;border:1px solid #222}
textarea{width:94%;padding:14px;border-radius:12px;background:#222;color:#fff;border:2px solid #05F2DB;font-size:16px}
.btn-main{width:96%;padding:14px;border:none;border-radius:12px;font-weight:bold;margin:10px 0;background:#05F2DB;color:#000;font-size:18px}
.btn-down{width:96%;padding:14px;border-radius:12px;font-weight:bold;margin:8px 0;background:#ff0050;color:#fff;border:none;font-size:16px;display:none}
img,video{width:100%;border-radius:14px;margin:10px 0;background:#222;min-height:350px;object-fit:cover}
</style>
</head>
<body>
<h1>✨ توليد من خيالك - بدون Limit</h1>
<div class="card">
<textarea id="prompt" rows="3">أسد يبحث عن فريسة سهلة فوجد نمر واكله، سينمائي واقعي، غابة</textarea>
<button class="btn-main" onclick="generate()">🎬 ولّد الآن - بدون انتظار</button>
<p id="status" style="color:#05F2DB">✅ جاهز - بدون limitreach</p>
<img id="img" style="display:none">
<video id="vid" controls autoplay loop playsinline style="display:none"></video>
<button id="downBtn" class="btn-down" onclick="downloadNow()">⬇️ حمل للاستديو</button>
<p style="font-size:11px;color:#888">لو جاك Limit انتظر 45 ثانية ودوس تاني - أو افتح dreamina.capcut.com للفيديو المتحرك المجاني</p>
</div>
<script>
let currentUrl="";
let tries=0;
async function generate(){
  let p=document.getElementById('prompt').value.trim();
  if(!p){alert("اكتب خيالك");return;}
  let status=document.getElementById('status');
  let img=document.getElementById('img');
  
  // 3 سيرفرات مجانية - لو واحد اتملى بمشي للبعده
  const servers=[
    "https://image.pollinations.ai/prompt/"+encodeURIComponent(p+" cinematic, realistic, 4k, national geographic, ultra detailed")+"?width=1024&height=576&model=flux&nologo=true&seed="+Math.floor(Math.random()*9999999)+"&nocache="+(Date.now()),
    "https://image.pollinations.ai/prompt/"+encodeURIComponent(p+" realistic photo")+"?width=1024&height=576&model=turbo&nologo=true&seed="+Math.floor(Math.random()*9999999),
    "https://gen.pollinations.ai/image/"+encodeURIComponent(p+" cinematic")+"?width=1024&height=576&model=flux&nologo=true"
  ];
  
  let url=servers[tries % servers.length];
  tries++;
  
  status.innerText="⏳ بولّد محاولة "+tries+"... (لو جاك Limit انتظر 45 ثانية)";
  currentUrl=url;
  img.src=url;
  img.style.display="block";
  
  img.onload=()=>{
    // لو الصورة صفراء فيها limitreach - حاول تاني تلقائيا
    if(img.naturalWidth<200){ // صورة الخطأ صغيرة
      status.innerText="⏳ السيرفر مليان، بحاول سيرفر تاني بعد 5 ثواني...";
      setTimeout(generate,5000);
      return;
    }
    status.innerText="✅ اتولد من خيالك! - دوس حمل للاستديو - خيال: "+p.substring(0,30);
    document.getElementById('downBtn').style.display="block";
  };
  img.onerror=()=>{
    status.innerText="⏳ النت ضعيف، بحاول تاني...";
    setTimeout(generate,3000);
  };
}
function downloadNow(){
  if(!currentUrl){alert("ولّد أولا");return;}
  let a=document.createElement('a');
  a.href=currentUrl;
  a.download="omar-ai-"+Date.now()+".jpg";
  a.target="_blank";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}
</script>
</body>
</html>
