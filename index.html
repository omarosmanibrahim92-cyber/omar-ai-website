<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Omar AI - نظيف</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:system-ui;text-align:center;padding:8px}
.box{background:#111;padding:14px;border-radius:16px;max-width:520px;margin:8px auto;border:1px solid #00ffcc}
textarea{width:96%;padding:14px;border-radius:12px;background:#222;color:#fff;border:1px solid #00ffcc;font-size:16px}
.btn{width:96%;padding:14px;border:none;border-radius:25px;font-weight:bold;margin:8px 0;font-size:16px;cursor:pointer}
.btn-gen{background:#00ffcc;color:#000}
.btn-ad{background:#ffeb3b;color:#000}
img{width:96%;border-radius:14px;margin:10px auto;display:block;min-height:300px;background:#222}
.ad-modal{position:fixed;inset:0;background:rgba(0,0,0,0.96);display:none;align-items:center;justify-content:center;z-index:9999;padding:20px}
.ad-card{background:#1a1a1a;border:2px solid #00ffcc;border-radius:20px;padding:20px;max-width:360px;width:100%}
</style>

<!-- هنا حتلصق كود Social Bar النظيف من Adsterra -->
<!-- مثال: <script src="https://.../socialbar.js"></script> -->

</head>
<body>

<div class="box" style="display:flex;justify-content:space-between">
<span style="color:#00ffcc;font-weight:bold">🤖 Omar AI</span>
<span id="cred" style="background:#00ffcc;color:#000;padding:6px 14px;border-radius:20px">3 صور</span>
</div>

<div class="box">
<p style="font-size:11px;color:#0f0">✅ بدون رفض - بدون نصب - 3 صور مجانية</p>
<textarea id="prompt" rows="3">قطة كبيرة جميلة في حديقة</textarea>
<button class="btn btn-gen" id="genBtn" onclick="generate()">✨ ولد الصورة</button>
<p id="status" style="font-size:13px;color:#00ffcc"></p>
</div>

<div id="result" class="box" style="display:none">
<img id="genImg">
<button class="btn btn-gen" style="background:#222;color:#fff;border:1px solid #444" onclick="downloadImg()">⬇️ تحميل</button>
</div>

<!-- مودال الاعلان النظيف -->
<div id="adModal" class="ad-modal">
<div class="ad-card">
<h3 style="color:#00ffcc">🎬 رصيدك انتهى</h3>
<p style="font-size:13px;color:#aaa">شاهد اعلان واحد قصير لتحصل على 3 صور جديدة</p>
<div style="font-size:30px;margin:15px">💰</div>
<button class="btn btn-ad" onclick="openCleanAd()">👆 شاهد الاعلان + احصل على 3 صور</button>
<p style="font-size:10px;color:#666">اعلان نظيف لدعم استمرار التطبيق مجاناً</p>
<button id="confirmBtn" style="display:none;margin-top:10px" class="btn btn-gen" onclick="confirmAd()">✅ شكراً شاهدت الاعلان - رجع لي 3 صور</button>
<p id="adInfo" style="font-size:11px;color:#0f0"></p>
</div>
</div>

<script>
// امسح الرابط النصب ده - استبدلو بكود Social Bar
const AD_LINK="https://www.highperformanceformat.com/watchnew?o=..."; // حتجيبو من Adsterra > Social Bar
let credits=parseInt(localStorage.getItem('omar_credits')||'3');

function updateUI(){
 document.getElementById('cred').innerText=credits+' صور';
 if(credits<=0){ document.getElementById('adModal').style.display='flex'; }
}
updateUI();

async function trans(text){
 try{let r=await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=en&dt=t&q="+encodeURIComponent(text));let d=await r.json();return d[0][0][0];}catch(e){return text;}
}

function makeSafePrompt(en){
 return en.toLowerCase().replace(/big cat/g,'cute kitten').replace(/beautiful/g,'cute').replace(/sexy|nude/g,'cute') + ", cute, adorable, 4k, cartoon, safe for work, children's illustration";
}

async function generate(){
 if(credits<=0){ document.getElementById('adModal').style.display='flex'; return; }
 let t=document.getElementById('prompt').value.trim(); if(!t) return;
 document.getElementById('genBtn').disabled=true;
 document.getElementById('status').innerText='⏳ بترجم...';
 let en=await trans(t);
 let safe=makeSafePrompt(en);
 document.getElementById('status').innerText='🎨 بولد: '+en;
 let url="https://image.pollinations.ai/prompt/"+encodeURIComponent(safe)+"?width=768&height=768&model=flux&seed="+Date.now()+"&nologo=true&safe=true&nofeed=true";
 document.getElementById('result').style.display='block';
 let img=document.getElementById('genImg');
 img.src=url;
 img.onload=()=>{
   document.getElementById('status').innerText='✅ تم!';
   credits--; localStorage.setItem('omar_credits',credits); updateUI();
   document.getElementById('genBtn').disabled=false;
   if(credits<=0) setTimeout(()=>{document.getElementById('adModal').style.display='flex';},1000);
 };
 img.onerror=()=>{
   document.getElementById('status').innerText='🔄 بجرب سيرفر تاني...';
   img.src="https://image.pollinations.ai/prompt/"+encodeURIComponent(safe)+"?width=512&height=512&model=turbo&seed="+(Date.now()+1)+"&nologo=true";
   document.getElementById('genBtn').disabled=false;
 };
}

function openCleanAd(){
 // الطريقة النظيفة - ما بتفتح صفحة نصب
 // لو عندك كود Social Bar حيظهر تلقائي
 if(AD_LINK.includes("highperformanceformat")){
   // لو لسه ما جبت كود Social Bar - نفتح صفحة وسيطة نظيفة
   window.open("https://google.com","_blank"); // مؤقت - بدلو برابط Social Bar
   document.getElementById('adInfo').innerText='✅ شكراً لدعمك - اضغط تأكيد بعد 3 ثواني';
 } else {
   window.open(AD_LINK,'_blank');
   document.getElementById('adInfo').innerText='✅ تم فتح الاعلان';
 }
 setTimeout(()=>{document.getElementById('confirmBtn').style.display='block';},3000);
}

function confirmAd(){
 credits=3; localStorage.setItem('omar_credits',credits);
 updateUI();
 document.getElementById('adModal').style.display='none';
 document.getElementById('status').innerText='🎉 حصلت على 3 صور جديدة!';
 document.getElementById('confirmBtn').style.display='none';
 document.getElementById('adInfo').innerText='';
}

function downloadImg(){
 let img=document.getElementById('genImg'); let a=document.createElement('a'); a.href=img.src; a.target='_blank'; a.click();
}
</script>
</body>
</html>
