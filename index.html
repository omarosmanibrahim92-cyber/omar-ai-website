<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Omar Video - ذكي وقصير</title>
<style>
body{margin:0;background:#0a0a0a;color:#fff;font-family:system-ui;text-align:center;padding:10px}
h1{color:#05F2DB;margin:10px}
.card{background:#161616;padding:14px;border-radius:18px;max-width:520px;margin:10px auto;border:1px solid #222}
input{width:90%;padding:13px;border-radius:12px;background:#222;color:#fff;border:1px solid #333;text-align:center}
.row{display:flex;gap:6px;justify-content:center;margin:10px 0;flex-wrap:wrap}
.btn{padding:10px 14px;border-radius:20px;border:1px solid #333;background:#222;color:#fff;cursor:pointer;font-size:13px}
.btn.active{background:#05F2DB;color:#000;border-color:#05F2DB;font-weight:bold}
.btn-main{width:95%;padding:14px;border:none;border-radius:12px;font-weight:bold;margin:8px 0;background:#05F2DB;color:#000;font-size:16px}
iframe{width:100%;height:380px;border-radius:14px;margin:10px 0;border:0;background:#000}
.tags span{background:#222;padding:6px 12px;border-radius:20px;font-size:13px;cursor:pointer;border:1px solid #333}
</style>
</head>
<body>
<h1>🎬 Omar AI Video</h1>
<div class="card">
<input id="q" placeholder="اكتب: قطة، كلب، أسد، كورة...">
<div class="row"><b style="font-size:13px;color:#888">المدة:</b>
<span class="btn active" id="d15" onclick="setD('short',15)">⚡ 15 ثانية</span>
<span class="btn" id="d30" onclick="setD('medium',30)">⏱️ 30 ثانية</span>
<span class="btn" id="d60" onclick="setD('long',60)">🎥 1 دقيقة</span>
</div>
<button class="btn-main" onclick="getV()">جيب فيديو مطابق ▶️</button>
<div class="row" style="margin-top:8px">
<span class="tags"><span onclick="setQ('قطة')">🐱 قطة</span><span onclick="setQ('كلب')">🐶 كلب</span><span onclick="setQ('أسد')">🦁 أسد</span><span onclick="setQ('سيارة')">🚗 سيارة</span><span onclick="setQ('بحر')">🌊 بحر</span><span onclick="setQ('ضحك')">😂 ضحك</span><span onclick="setQ('كورة')">⚽ كورة</span><span onclick="setQ('طبيعة')">🌲 طبيعة</span></span>
</div>
<p id="s" style="color:#05F2DB;font-size:13px">✅ اختار المدة واكتب كلمة - فيديو قصير ومطابق!</p>
<iframe id="v" src="https://www.youtube.com/embed?listType=search&list=funny%20cat%20shorts" allowfullscreen></iframe>
<button class="btn-main" style="background:#222;color:#05F2DB;border:1px solid #05F2DB" onclick="shareV()">⬇️ تحميل / مشاركة</button>
</div>
<script>
let curDur="short"; let curQuery="funny cat shorts"; let curLink="";
function setD(type,sec){
curDur=type;
document.querySelectorAll('.row .btn').forEach(b=>b.classList.remove('active'));
if(sec==15)document.getElementById('d15').classList.add('active');
if(sec==30)document.getElementById('d30').classList.add('active');
if(sec==60)document.getElementById('d60').classList.add('active');
getV();
}
function setQ(t){document.getElementById('q').value=t;getV();}
function getV(){
let q=document.getElementById('q').value.trim()||"قطة";
let s=document.getElementById('s');let v=document.getElementById('v');
let durText=curDur=="short"?"shorts 15 seconds":curDur=="medium"?"shorts 30 seconds":"short video";
let searchQ=encodeURIComponent(q+" "+durText+" funny");
curQuery=q;
curLink="https://www.youtube.com/results?search_query="+searchQ;
v.src="https://www.youtube.com/embed?listType=search&list="+searchQ+"&autoplay=1";
s.innerText="✅ بجيب ليك فيديو '"+q+"' مدته "+(curDur=="short"?"15ث":curDur=="medium"?"30ث":"1د")+" - مطابق 100%";
}
function shareV(){
let url=curLink||"https://www.youtube.com/results?search_query="+encodeURIComponent(curQuery);
if(navigator.share){navigator.share({title:"Omar Video - "+curQuery,url:url});}
else{window.open(url,"_blank");}
}
</script>
</body>
</html>
