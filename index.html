<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صانع الفيديوهات بالذكاء الاصطناعي</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        h1 {
            color: #00ff88;
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            height: 100px;
            background-color: #2a2a2a;
            border: 2px solid #333;
            border-radius: 8px;
            color: #fff;
            padding: 10px;
            box-sizing: border-box;
            resize: none;
            margin-bottom: 15px;
        }
        button {
            background-color: #00ff88;
            color: #121212;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }
        button:hover {
            background-color: #00cc6e;
        }
        .result-container {
            margin-top: 25px;
        }
        video {
            width: 100%;
            border-radius: 8px;
            display: none;
            margin-top: 15px;
        }
        .loading {
            display: none;
            color: #00ff88;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>مولد الفيديوهات بالذكاء الاصطناعي</h1>
        <p>اكتب الوصف باللغة الإنجليزية للحصول على أفضل نتيجة:</p>
        <textarea id="promptInput" placeholder="مثال: A cinematic shot of a futuristic city with flying cars, sunset..."></textarea>
        <button id="generateBtn" onclick="generateVideo()">اصنع الفيديو</button>
        
        <div class="loading" id="loadingText">جاري توليد الفيديو الذكي... قد يستغرق الأمر دقيقة...</div>
        
        <div class="result-container">
            <video id="videoResult" controls></video>
        </div>
    </div>

    <script>
        async function generateVideo() {
            const prompt = document.getElementById('promptInput').value;
            const generateBtn = document.getElementById('generateBtn');
            const loadingText = document.getElementById('loadingText');
            const videoResult = document.getElementById('videoResult');

            if (!prompt) {
                alert('الرجاء كتابة وصف أولاً!');
                return;
            }

            // تفعيل وضع التحميل
            generateBtn.disabled = true;
            loadingText.style.display = 'block';
            videoResult.style.display = 'none';

            try {
                // استخدام نموذج مفتوح لتوليد الفيديو (ModelScope) عبر Hugging Face API كمثال سرييع
                const response = await fetch(
                    "https://huggingface.co",
                    {
                        headers: { 
                            "Authorization": "Bearer hf_XXXXXX", // استبدل XXXXXX بمفتاح API الخاص بك من Hugging Face
                            "Content-Type": "application/json" 
                        },
                        method: "POST",
                        body: JSON.stringify({ inputs: prompt }),
                    }
                );

                if (!response.ok) {
                    throw new Error('فشل في الاتصال بالخادم أو توليد الفيديو.');
                }

                const blob = await response.blob();
                const videoUrl = URL.createObjectURL(blob);
                
                // عرض الفيديو الناتج
                videoResult.src = videoUrl;
                videoResult.style.display = 'block';

            } catch (error) {
                alert('حدث خطأ: ' + error.message + '\nتأكد من إضافة الـ API Key الخاص بك في الكود.');
            } finally {
                // إلغاء وضع التحميل
                generateBtn.disabled = false;
                loadingText.style.display = 'none';
            }
        }
    </script>
</body>
</html>
