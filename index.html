<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Omar AI - توليد حقيقي من الخيال</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:system-ui;text-align:center;padding:10px}
h1{color:#05F2DB}
.card{background:#111;padding:14px;border-radius:18px;max-width:600px;margin:auto;border:1px solid #222}
input,textarea{width:94%;padding:12px;border-radius:12px;background:#222;color:#fff;border:1px solid #444;margin:6px 0;font-size:15px}
.btn-main{width:96%;padding:14px;border:none;border-radius:12px;font-weight:bold;margin:8px 0;background:#05F2DB;color:#000;font-size:16px}
.btn-down{width:96%;padding:14px;border-radius:12px;font-weight:bold;margin:8px 0;background:#ff0050;color:#fff;border:none;font-size:16px;display:none}
video{width:100%;height:360px;border-radius:14px;margin:10px 0;background:#222}
</style>
</head>
<body>
<h1>✨ Omar AI - توليد فيديو من خيالك</h1>
<div class="card">
<p style="font-size:12px;color:#888">ضع مفتاح fal.ai المجاني (مرة واحدة)</p>
<input id="apikey" placeholder="fal_xxxx - جيبه من fal.ai" type="password">

<textarea id="prompt" rows="3" placeholder="اكتب أي خيال: أسد سايق ركشة حمراء في سوق أمدرمان، لابس نظارة، 8 ثواني سينمائي"></textarea>

<div style="display:flex;gap:6px;justify-content:center">
<select id="duration" style="padding:8px;border-radius:20px;background:#222;color:#fff;border:1px solid #333">
<option value="5">5 ثواني (أسرع)</option>
<option value="10">10 ثواني</option>
</select>
<select id="model" style="padding:8px;border-radius:20px;background:#222;color:#fff;border:1px solid #333">
<option value="fal-ai/kling-video/v1.6/standard/text-to-video">Kling 1.6 - أفضل حركة</option>
<option value="fal-ai/luma-dream-machine">Luma Dream - سينمائي</option>
<option value="fal-ai/hunyuan-video">Hunyuan - مجاني رخيص</option>
</select>
</div>

<button class="btn-main" onclick="generate()">🎬 ولّد فيديو من خيالي - توليد حقيقي</button>
<p id="status" style="color:#05F2DB;font-size:13px">✅ اكتب أي شي تتخيله - حيتولد فيديو جديد ما موجود في يوتيوب</p>

<video id="video" controls playsinline></video>

<button id="downBtn" class="btn-down" onclick="downloadVideo()">⬇️ حمل للاستديو</button>
</div>

<script>
let currentVideoUrl=null;

async function generate(){
  let key=document.getElementById('apikey').value.trim();
  let prompt=document.getElementById('prompt').value.trim();
  if(!key){alert("دخل مفتاح fal.ai المجاني من fal.ai");return;}
  if(!prompt){alert("اكتب خيالك!");return;}
  
  localStorage.setItem('fal_key',key);
  let status=document.getElementById('status');
  let video=document.getElementById('video');
  status.innerText="⏳ بولّد: '"+prompt+"' - بياخد 2-4 دقائق...";
  
  try{
    // 1. إرسال طلب التوليد
    let model=document.getElementById('model').value;
    let res=await fetch("https://queue.fal.run/"+model,{
      method:"POST",
      headers:{"Authorization":"Key "+key,"Content-Type":"application/json"},
      body:JSON.stringify({prompt:prompt,duration:document.getElementById('duration').value+"",aspect_ratio:"16:9"})
    });
    let data=await res.json();
    let requestId=data.request_id;
    if(!requestId){status.innerText="❌ خطأ: "+JSON.stringify(data);return;}
    
    // 2. انتظار النتيجة (polling)
    status.innerText="⏳ جاري التوليد... رقم الطلب: "+requestId+" - انتظر 2 دقيقة";
    let resultUrl="https://queue.fal.run/fal-ai/kling-video/requests/"+requestId+"/status";
    if(model.includes("luma")) resultUrl="https://queue.fal.run/"+model+"/requests/"+requestId+"/status";
    
    let tries=0;
    while(tries<60){
      await new Promise(r=>setTimeout(r,5000));
      let sRes=await fetch(resultUrl,{headers:{"Authorization":"Key "+key}});
      let sData=await sRes.json();
      if(sData.status=="COMPLETED"){
        let videoUrl=sData.response.video.url || sData.response.video_url;
        currentVideoUrl=videoUrl;
        video.src=videoUrl;
        video.play();
        status.innerText="✅ اتولد! '"+prompt+"' - فيديو جديد من خيالك";
        document.getElementById('downBtn').style.display="block";
        return;
      }else if(sData.status=="FAILED"){
        status.innerText="❌ فشل: "+JSON.stringify(sData);
        return;
      }
      status.innerText="⏳ لسه بولّد... "+(tries*5)+" ثانية - "+sData.status;
      tries++;
    }
  }catch(e){
    status.innerText="❌ خطأ شبكة: "+e.message+" - جرب VPN لو في السودان";
  }
}

function downloadVideo(){
  if(!currentVideoUrl){alert("ولّد أولاً");return;}
  let a=document.createElement('a');
  a.href=currentVideoUrl;
  a.download="omar-ai-"+Date.now()+".mp4";
  a.target="_blank";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

// حفظ المفتاح
window.onload=()=>{
  let k=localStorage.getItem('fal_key');
  if(k) document.getElementById('apikey').value=k;
}
</script>
</body>
</html>
