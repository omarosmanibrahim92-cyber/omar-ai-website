<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Omar AI - شاهد إعلان</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:system-ui;padding:0;margin:0;text-align:center}
.top{padding:12px;background:#111;display:flex;justify-content:space-between;border-bottom:1px solid #00ffcc33}
.credits-box{background:#1a1a1a;border:1px solid #00ffcc;border-radius:10px;padding:10px;margin:15px auto;max-width:500px}
.input-box{width:88%;max-width:500px;height:90px;background:#1e1e1e;color:#fff;border:2px solid #00ffcc;border-radius:15px;padding:15px;margin:10px auto;display:block}
.btn{background:#00ffcc;color:#000;font-weight:bold;padding:15px;border:none;border-radius:30px;width:88%;max-width:500px;font-size:18px;cursor:pointer}
.btn-watch{background:#ffeb3b;color:#000;font-weight:bold;padding:15px;border:none;border-radius:30px;width:88%;max-width:500px;font-size:18px;cursor:pointer;animation:pulse 1s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
.ad-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.95);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:9999;padding:20px}
.ad-content{background:#1a1a1a;border:2px solid #00ffcc;border-radius:20px;padding:20px;max-width:400px;width:90%}
.ad-timer{background:#00ffcc;color:#000;padding:5px 15px;border-radius:20px;font-weight:bold;margin:10px;display:inline-block}
.ad-place{width:100%;height:200px;background:#000;border-radius:15px;display:flex;align-items:center;justify-content:center;margin:15px 0;color:#888;border:1px dashed #444}
.result-img{width:88%;max-width:500px;border-radius:15px;margin:15px auto;display:block}
</style>
</head>
<body>
<div class="top"><span>🤖 Omar AI</span><span id="creditDisplay" style="background:#00ffcc;color:#000;padding:5px 12px;border-radius:20px;font-size:13px">...</span></div>
<div class="credits-box">رصيدك: <span id="creditNum">0</span> صور</div>
<textarea class="input-box" id="prompt" placeholder="اكتب وصف الصورة..."></textarea>
<button class="btn" id="generateBtn" onclick="generateImage()">✨ ولّد الصورة</button>
<div id="watchSection" style="display:none">
<button class="btn-watch" onclick="watchAd()">🎬 شاهد إعلان 15 ثانية +1 صورة</button>
<p style="font-size:12px;color:#888">الإعلانات بتخلي التطبيق مجاني ❤️</p>
</div>
<div id="result"></div>

<div class="ad-overlay" id="adOverlay">
<div class="ad-content">
<h3 style="color:#00ffcc">🎥 شاهد الإعلان</h3>
<div class="ad-place" id="adPlace">
<div><p>📢 مساحة إعلانية</p><p style="font-size:11px">هنا يظهر إعلانك<br>شركة / تطبيق / AdMob</p></div>
</div>
<div class="ad-timer" id="adTimer">15 ثانية</div><br>
<button id="claimBtn" style="display:none;background:#00ffcc;color:#000;padding:12px 25px;border:none;border-radius:25px;font-weight:bold;margin-top:15px;width:100%;cursor:pointer" onclick="claimReward()">✅ استلم صورتك</button>
<p id="waitText" style="font-size:12px;color:#aaa">انتظر حتى ينتهي...</p>
</div>
</div>

<script>
let credits = parseInt(localStorage.getItem('omar_credits') || '3');
function updateUI(){
 document.getElementById('creditNum').innerText=credits;
 document.getElementById('creditDisplay').innerText=credits+' صورة';
 if(credits<=0){
  document.getElementById('generateBtn').style.display='none';
  document.getElementById('watchSection').style.display='block';
  document.getElementById('creditDisplay').innerText='0 - شاهد إعلان';
  document.getElementById('creditDisplay').style.background='#ffeb3b';
 }else{
  document.getElementById('generateBtn').style.display='inline-block';
  document.getElementById('watchSection').style.display='none';
  document.getElementById('creditDisplay').style.background='#00ffcc';
 }
}
updateUI();
function generateImage(){
 if(credits<=0){alert('شاهد إعلان أول');return;}
 let p=document.getElementById('prompt').value;
 if(!p.trim()){alert('اكتب وصف أول');return;}
 credits--;localStorage.setItem('omar_credits',credits);updateUI();
 let imgUrl='https://image.pollinations.ai/prompt/'+encodeURIComponent(p)+'?nologo=true&seed='+Date.now();
 document.getElementById('result').innerHTML='<p>⏳ جاري التوليد...</p><img class="result-img" src="'+imgUrl+'">';
}
function watchAd(){
 document.getElementById('adOverlay').style.display='flex';
 let time=15;document.getElementById('adTimer').innerText=time+' ثانية';
 document.getElementById('claimBtn').style.display='none';
 let interval=setInterval(()=>{
  time--;document.getElementById('adTimer').innerText=time+' ثانية';
  if(time<=0){clearInterval(interval);document.getElementById('adTimer').innerText='انتهى ✅';document.getElementById('claimBtn').style.display='block';document.getElementById('waitText').innerText='مبروك! دوس استلم';}
 },1000);
}
function claimReward(){credits++;localStorage.setItem('omar_credits',credits);document.getElementById('adOverlay').style.display='none';updateUI();alert('✅ خدت صورة مجانية! رصيدك:'+credits);}
</script>
</body>
</html>
