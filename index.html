<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Omar Video AI</title><style>body{margin:0;background:#000;color:#fff;font-family:sans-serif;text-align:center}.box{max-width:600px;margin:20px auto;padding:15px;background:#111;border-radius:15px}input{width:90%;padding:12px;border-radius:10px;background:#222;color:#fff;border:1px solid #333}button{width:92%;padding:13px;margin:10px;background:#FF0055;border:0;border-radius:10px;font-weight:bold}video{width:100%;border-radius:12px;margin-top:10px;display:none}</style></head><body><div class="box"><h2>ولد فيديو بالذكاء الاصطناعي 🎬</h2><input id="p" value="ولد سوداني ماشي في سوق عطبرة، سينمائي"><button onclick="go()">ولد فيديو 🚀</button><p id="s">جاهز</p><video id="v" controls></video></div><script>const T="r8_LZTntSaRnDjGOGOe6Q1cAap6CqSMraF0oTj6U";async function go(){let s=document.getElementById('s'),v=document.getElementById('v');let prompt=document.getElementById('p').value;s.innerText="بولد فيديو... ده بياخد 2-3 دقايق ⏳";let r=await fetch("https://api.replicate.com/v1/predictions",{method:"POST",headers:{"Authorization":"Token "+T,"Content-Type":"application/json"},body:JSON.stringify({version:"kwaivgi/kling-v2.1-master",input:{prompt:prompt,duration:5,aspect_ratio:"16:9"}})});let j=await r.json();let id=j.id;while(true){await new Promise(x=>setTimeout(x,5000));let r2=await fetch("https://api.replicate.com/v1/predictions/"+id,{headers:{"Authorization":"Token "+T}});let j2=await r2.json();if(j2.status=="succeeded"){v.src=j2.output;v.style.display="block";s.innerText="✅ الفيديو اتولد!";break}if(j2.status=="failed"){s.innerText="❌ "+j2.error;break}s.innerText="شغال... "+j2.status}}</script></body></html>
