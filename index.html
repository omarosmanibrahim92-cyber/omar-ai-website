<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Omar REAL VIDEO</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:system-ui;text-align:center}
h1{color:#ff0050}
.card{background:#111;padding:16px;border-radius:16px;max-width:500px;margin:15px auto}
textarea{width:94%;padding:12px;border-radius:10px;background:#1e1e1e;color:#fff}
button{width:95%;padding:14px;border:none;border-radius:10px;font-weight:bold;margin:8px 0}
.gen{background:#ff0050;color:#fff}
.dl{background:#00f2ea;color:#000}
video{width:100%;max-width:360px;border-radius:12px;margin:12px auto;display:block}
</style></head>
<body>
<h1>🎬 Omar REAL VIDEO</h1>
<div class="card">
<textarea id="p" rows="3" placeholder="lion, car, nature"></textarea>
<button class="gen" onclick="getV()">جيب فيديو حقيقي</button>
<p id="s" style="color:#00f2ea"></p>
<video id="v" controls loop autoplay playsinline style="display:none"></video>
<button class="dl" id="d" style="display:none" onclick="down()">حفظ</button>
</div>
<script>
const vids=["https://cdn.coverr.co/videos/coverr-aerial-view-of-city-1578755.mp4","https://cdn.coverr.co/videos/coverr-lion-1572.mp4","https://cdn.coverr.co/videos/coverr-car-in-the-desert-1565.mp4"];
function getV(){let video=document.getElementById('v');video.src=vids[Math.floor(Math.random()*vids.length)];video.style.display='block';video.play();document.getElementById('s').innerText="✅ فيديو جاهز!";document.getElementById('d').style.display='block';}
function down(){let a=document.createElement('a');a.href=document.getElementById('v').src;a.target='_blank';a.click();}
</script>
</body>
</html>
