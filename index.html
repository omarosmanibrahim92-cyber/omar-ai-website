<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Omar Video - محرك بحث شامل</title>
<style>
body{margin:0;background:#050505;color:#fff;font-family:system-ui;text-align:center;padding:10px}
h1{color:#05F2DB;font-size:22px}
.card{background:#111;padding:15px;border-radius:18px;max-width:580px;margin:10px auto;border:1px solid #222}
input{width:92%;padding:14px;border-radius:12px;background:#222;color:#fff;border:1px solid #333;text-align:center;font-size:16px}
.row{display:flex;gap:6px;justify-content:center;margin:10px 0;flex-wrap:wrap}
.btn{padding:8px 14px;border-radius:20px;border:1px solid #333;background:#222;color:#fff;cursor:pointer;font-size:13px}
.btn.active{background:#05F2DB;color:#000;font-weight:bold}
.btn-main{width:96%;padding:14px;border:none;border-radius:12px;font-weight:bold;margin:8px 0;background:#05F2DB;color:#000;font-size:16px}
.btn-tik{background:#000;color:#fff;border:1px solid #ff0050}
.btn-fb{background:#1877F2;color:#fff}
.btn-yt{background:#FF0000;color:#fff}
iframe{width:100%;height:480px;border-radius:14px;margin:10px 0;border:0;background:#000}
.note{font-size:12px;color:#888;margin:6px}
</style>
</head>
<body>
<h1>🔍 Omar Video Search - بحث شامل</h1>
<div class="card">
<input id="q" placeholder="ابحث عن أي شي: قطة سايقة سيارة، زول بيرقص، طبيعة...">
<div class="row">
<span class="btn active" id="b15" onclick="setD(15)">15 ث</span>
<span class="btn" id="b30" onclick="setD(30)">30 ث</span>
<span class="btn" id="b60" onclick="setD(60)">60 ث</span>
<span class="btn" id="b0" onclick="setD(0)">كل المدد</span>
</div>
<button class="btn-main" onclick="searchAll()">🔍 ابحث في كل التطبيقات الآن</button>

<div class="row">
<button class="btn btn-yt" onclick="openYT()">▶️ YouTube</button>
<button class="btn btn-tik" onclick="openTik()">🎵 TikTok</button>
<button class="btn btn-fb" onclick="openFB()">📘 Facebook Reels</button>
<button class="btn" onclick="openInsta()" style="background:#E1306C;color:#fff">📸 Instagram</button>
</div>

<p id="s" style="color:#05F2DB;font-size:13px">✅ اكتب أي كلمة واختار المدة - البحث حر 100% - مش محدود!</p>
<iframe id="v" src="https://www.youtube.com/embed?listType=search&list=cat%20driving%20car%20shorts" allowfullscreen></iframe>
<p class="note" id="links"></p>
</div>

<script>
let dur=15;
let lastQuery="قطة سايقة سيارة";
function setD(d){
dur=d;
document.querySelectorAll('[id^=b]').forEach(x=>x.classList.remove('active'));
document.getElementById('b'+(d==0?0:d)).classList.add('active');
}
function searchAll(){
let q=document.getElementById('q').value.trim()||"قطة سايقة سيارة";
lastQuery=q;
let s=document.getElementById('s');
let v=document.getElementById('v');
let links=document.getElementById('links');

let durText=dur==0?"":dur==15?" 15 seconds shorts":dur==30?" 30 seconds shorts":" 60 seconds";
let searchQ=encodeURIComponent(q+durText);

 // يوتيوب شغال في السودان - نعرضه في الموقع
 v.src="https://www.youtube.com/embed?listType=search&list="+searchQ+"&autoplay=1";
 
 s.innerText="✅ ببحث عن: '"+q+"' - المدة: "+(dur==0?"كل المدد":dur+" ث")+" - من 4 مصادر";
 links.innerHTML="🔗 روابط مباشرة شغالة:<br>"+
 "<a href='https://www.youtube.com/results?search_query="+searchQ+"' target='_blank' style='color:#05F2DB'>YouTube: "+q+"</a> | "+
 "<a href='https://www.tiktok.com/search?q="+encodeURIComponent(q)+"' target='_blank' style='color:#ff0050'>TikTok: "+q+"</a> | "+
 "<a href='https://www.facebook.com/reels/search/?q="+encodeURIComponent(q)+"' target='_blank' style='color:#1877F2'>FB Reels: "+q+"</a>";

 // لو المدة 15ث نضيف Shorts فقط
 if(dur==15){
   // نفتح تيك توك تلقائيا في نافذة جديدة لو المستخدم عايز
   console.log("Searching TikTok + FB + YT for:", q);
 }
}
function openYT(){
let q=encodeURIComponent(lastQuery+(dur==15?" shorts":""));
window.open("https://www.youtube.com/results?search_query="+q+"&sp=EgIYAQ%253D%253D","_blank");
}
function openTik(){
window.open("https://www.tiktok.com/search?q="+encodeURIComponent(lastQuery),"_blank");
}
function openFB(){
window.open("https://www.facebook.com/reels/search/?q="+encodeURIComponent(lastQuery),"_blank");
}
function openInsta(){
window.open("https://www.instagram.com/reels/search/?q="+encodeURIComponent(lastQuery),"_blank");
}
window.onload=searchAll;
</script>
</body>
</html>
