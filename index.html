<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صانع الفيديوهات بالذكاء الاصطناعي</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
        }
        h1 { text-align: center; color: #333; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        textarea, input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px;
            margin-top: 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { background-color: #218838; }
        #videoResult { margin-top: 20px; text-align: center; }
        video { width: 100%; border-radius: 5px; display: none; }
        .loading { display: none; color: #666; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h1>توليد فيديو بالذكاء الاصطناعي 🎬</h1>
    
    <label for="apiKey">مفتاح API (API Key):</label>
    <input type="text" id="apiKey" placeholder="أدخل مفتاح API الخاص بك هنا...">

    <label for="textInput">النص المراد تحويله إلى كلام:</label>
    <textarea id="textInput" rows="4" placeholder="اكتب ما تريد أن تقوله الشخصية في الفيديو..."></textarea>

    <label for="imageUrl">رابط صورة الشخصية (رابط مباشر):</label>
    <input type="text" id="imageUrl" value="https://unsplash.com" placeholder="أدخل رابط صورة الشخصية...">

    <button onclick="generateVideo()">إنشاء الفيديو ✨</button>

    <div class="loading" id="loadingText">جاري معالجة وإنشاء الفيديو، يرجى الانتظار...</div>

    <div id="videoResult">
        <video id="outputVideo" controls></video>
    </div>
</div>

<script>
    async function generateVideo() {
        const apiKey = document.getElementById('apiKey').value;
        const text = document.getElementById('textInput').value;
        const imageUrl = document.getElementById('imageUrl').value;
        const loadingText = document.getElementById('loadingText');
        const videoElement = document.getElementById('outputVideo');

        if (!apiKey || !text) {
            alert("الرجاء إدخال مفتاح API والنص المطلوب!");
            return;
        }

        loadingText.style.display = "block";
        videoElement.style.display = "none";

        try {
            // الخطوة 1: إرسال طلب لإنشاء الفيديو (D-ID API كمثال)
            const response = await fetch('https://d-id.com', {
                method: 'POST',
                headers: {
                    'Authorization': `Basic ${btoa(apiKey + ':')}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    script: {
                        type: 'text',
                        sub_type: 'tts',
                        input: text,
                        provider: { type: 'microsoft', voice_id: 'ar-EG-ShakirNeural' } // صوت عربي
                    },
                    source_url: imageUrl
                })
            });

            const data = await response.json();
            if (!response.ok) throw new Error(data.message || "فشل في إرسال الطلب");

            const talkId = data.id;

            // الخطوة 2: التحقق من جاهزية الفيديو (Polling)
            checkVideoStatus(talkId, apiKey);

        } catch (error) {
            alert("حدث خطأ: " + error.message);
            loadingText.style.display = "none";
        }
    }

    async function checkVideoStatus(talkId, apiKey) {
        const loadingText = document.getElementById('loadingText');
        const videoElement = document.getElementById('outputVideo');

        const interval = setInterval(async () => {
            try {
                const res = await fetch(`https://d-id.com/${talkId}`, {
                    headers: { 'Authorization': `Basic ${btoa(apiKey + ':')}` }
                });
                const data = await res.json();

                if (data.status === 'done') {
                    clearInterval(interval);
                    loadingText.style.display = "none";
                    videoElement.src = data.result_url;
                    videoElement.style.display = "block";
                } else if (data.status === 'failed') {
                    clearInterval(interval);
                    alert("فشل الذكاء الاصطناعي في معالجة الفيديو.");
                    loadingText.style.display = "none";
                }
            } catch (err) {
                clearInterval(interval);
                loadingText.style.display = "none";
                console.error(err);
            }
        }, 5000); // يفحص كل 5 ثوانٍ
    }
</script>

</body>
</html>
