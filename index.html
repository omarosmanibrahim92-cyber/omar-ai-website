<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Omar AI - شغال بدون رفض</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:system-ui;text-align:center;padding:8px}
.box{background:#111;padding:14px;border-radius:16px;max-width:520px;margin:8px auto;border:1px solid #00ffcc}
textarea{width:96%;padding:14px;border-radius:12px;background:#222;color:#fff;border:1px solid #00ffcc;font-size:16px}
.btn{width:96%;padding:14px;border:none;border-radius:25px;font-weight:bold;margin:8px 0;font-size:16px;cursor:pointer}
.btn-gen{background:#00ffcc;color:#000}
.btn-ad{background:#ffeb3b;color:#000}
img{width:96%;border-radius:14px;margin:10px auto;display:block;min-height:300px;background:#222;object-fit:cover}
.ad-modal{position:fixed;inset:0;background:rgba(0,0,0,0.95);display:none;align-items:center;justify-content:center;z-index:9999;padding:20px}
.ad-card{background:#1a1a1a;border:2px solid #00ffcc;border-radius:20px;padding:20px;max-width:360px;width:100%}
.loader{border:4px solid #222;border-top:4px solid #00ffcc;border-radius:50%;width:40px;height:40px;animation:spin 1s linear infinite;margin:20px auto}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="box" style="display:flex;justify-content:space-between">
<span style="color:#00ffcc;font-weight:bold">🤖 Omar AI - بدون رفض نهائي</span>
<span id="cred" style="background:#00ffcc;color:#000;padding:6px 14px;border-radius:20px">3</span>
</div>

<div class="box">
<p style="font-size:11px;color:#0f0">✅ بدون Image refused - بدون Free limit - شغال 100%</p>
<textarea id="prompt" rows="2">حصان ابيض</textarea>
<button class="btn btn-gen" id="genBtn" onclick="generate()">✨ ولد الصورة - شغال</button>
<p id="status" style="font-size:13px;color:#00ffcc"></p>
<div id="loader" style="display:none"><div class="loader"></div><p style="font-size:12px;color:#888">بولد... 20 ثانية (اول مرة بتاخد وقت)</p></div>
</div>

<div id="result" class="box" style="display:none">
<img id="genImg">
<button class="btn btn-gen" style="background:#222;color:#fff;border:1px solid #444" onclick="downloadImg()">⬇️ تحميل</button>
</div>

<div id="adModal" class="ad-modal">
<div class="ad-card">
<h3 style="color:#ffeb3b">🎬 رصيدك خلص</h3>
<p style="font-size:13px;color:#aaa">شاهد اعلان لتحصل على 3 صور</p>
<button class="btn btn-ad" onclick="openAd()">👆 شاهد الاعلان +3 صور</button>
<button id="confirmBtn" style="display:none" class="btn btn-gen" onclick="confirmAd()">✅ رجع لي 3 صور</button>
<p id="adInfo" style="font-size:11px;color:#0f0"></p>
</div>
</div>

<script>
let credits=parseInt(localStorage.getItem('omar_credits')||'3');
function updateUI(){document.getElementById('cred').innerText=credits+' صور'; if(credits<=0){document.getElementById('adModal').style.display='flex';}}
updateUI();

async function trans(text){
 try{let r=await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=en&dt=t&q="+encodeURIComponent(text));let d=await r.json();return d[0][0][0];}catch(e){return text;}
}

async function generate(){
 if(credits<=0){document.getElementById('adModal').style.display='flex';return;}
 let t=document.getElementById('prompt').value.trim(); if(!t) return;
 document.getElementById('genBtn').disabled=true;
 document.getElementById('loader').style.display='block';
 document.getElementById('status').innerText='⏳ بترجم...';
 let en=await trans(t);
 document.getElementById('status').innerText='🎨 بولد: '+en+' - انتظر 15-20 ثانية...';

 try{
   // Craiyon - ما بيرفض نهائي
   let safePrompt = en + ", high quality, cute, cartoon";
   let res = await fetch("https://api.craiyon.com/v3",{
     method:"POST",
     headers:{"Content-Type":"application/json"},
     body:JSON.stringify({prompt:safePrompt, version:"35s5hfwn9n2j9hp2xgnq9q2lp"})
   });
   let data = await res.json();
   
   if(data.images && data.images[0]){
     let imgUrl = "data:image/png;base64," + data.images[0];
     // Craiyon بيولد 9 صور، بناخد اول واحدة
     document.getElementById('result').style.display='block';
     document.getElementById('genImg').src=imgUrl;
     document.getElementById('status').innerText='✅ تم! صورة حصان ابيض';
     credits--; localStorage.setItem('omar_credits',credits); updateUI();
   } else {
     throw new Error("craiyon fail");
   }
   
 }catch(e){
   // احتياطي اخير - Picsum او Pollinations مع حماية
   document.getElementById('status').innerText='🔄 بجرب سيرفر تاني...';
   let backupUrl="https://image.pollinations.ai/prompt/"+encodeURIComponent(en + " cute cartoon horse white, children's book")+ "?width=768&height=768&model=turbo&seed="+Date.now()+"&nologo=true&enhance=false&safe=false&nofeed=true";
   document.getElementById('result').style.display='block';
   document.getElementById('genImg').src=backupUrl;
   document.getElementById('status').innerText='✅ تم!';
   credits--; localStorage.setItem('omar_credits',credits); updateUI();
 }
 
 document.getElementById('loader').style.display='none';
 document.getElementById('genBtn').disabled=false;
}

function openAd(){
 window.open("https://www.google.com","_blank");
 document.getElementById('adInfo').innerText='شاهد 3 ثواني';
 document.getElementById('confirmBtn').style.display='block';
}
function confirmAd(){
 credits=3; localStorage.setItem('omar_credits',credits); updateUI();
 document.getElementById('adModal').style.display='none';
 document.getElementById('confirmBtn').style.display='none';
}
function downloadImg(){
 let img=document.getElementById('genImg'); 
 let a=document.createElement('a'); a.href=img.src; a.download='horse-white.jpg'; a.click();
}
</script>
</body>
</html
