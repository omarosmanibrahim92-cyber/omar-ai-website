<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Omar - بحث حر حقيقي</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:system-ui;text-align:center;padding:10px}
h1{color:#05F2DB;font-size:20px}
.card{background:#111;padding:14px;border-radius:18px;max-width:580px;margin:10px auto;border:1px solid #222}
input{width:92%;padding:14px;border-radius:12px;background:#222;color:#fff;border:1px solid #333;text-align:center;font-size:16px}
.row{display:flex;gap:6px;justify-content:center;margin:10px 0;flex-wrap:wrap}
.btn{padding:8px 14px;border-radius:20px;border:1px solid #333;background:#222;color:#fff;cursor:pointer;font-size:13px}
.btn.active{background:#05F2DB;color:#000;font-weight:bold}
.btn-main{width:96%;padding:14px;border:none;border-radius:12px;font-weight:bold;margin:8px 0;background:#05F2DB;color:#000;font-size:16px}
iframe{width:100%;height:500px;border-radius:14px;margin:10px 0;border:0;background:#000}
.note{font-size:12px;color:#888}
</style>
</head>
<body>
<h1>🔍 Omar - بحث حر من كل المنصات</h1>
<div class="card">
<input id="q" placeholder="ابحث عن أي شي: أسد سايق سيارة، قطة بتطبخ...">
<div class="row">
<span class="btn active" id="b15" onclick="setD(15)">⚡ 15 ث</span>
<span class="btn" id="b30" onclick="setD(30)">⏱️ 30 ث</span>
<span class="btn" id="b60" onclick="setD(60)">🎥 60 ث</span>
<span class="btn" id="b0" onclick="setD(0)">كل المدد</span>
</div>
<button class="btn-main" onclick="searchAll()">🔍 ابحث الآن - أي كلمة + أي مدة</button>
<div class="row">
<button class="btn" onclick="openTik()" style="border-color:#ff0050">🎵 افتح نفس البحث في TikTok</button>
<button class="btn" onclick="openFB()" style="border-color:#1877F2">📘 افتح في Facebook Reels</button>
</div>
<p id="s" style="color:#05F2DB;font-size:13px">✅ اكتب أي جملة - الموقع حيجيب فيديو مطابق بالمدة والوصف</p>
<iframe id="v" src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
<p class="note" id="info">المصدر: YouTube + TikTok + FB عبر Piped API - شغال في السودان</p>
</div>
<script>
let dur=15;
let lastQuery="أسد سايق سيارة";
const PIPED_INSTANCES=[
"https://pipedapi.kavin.rocks",
"https://api.piped.private.coffee",
"https://pipedapi.adminforge.de"
];
function setD(d){
dur=d;
document.querySelectorAll('[id^=b]').forEach(x=>x.classList.remove('active'));
document.getElementById('b'+d).classList.add('active');
}
async function searchAll(){
let q=document.getElementById('q').value.trim()||"أسد سايق سيارة";
lastQuery=q;
let s=document.getElementById('s');
let v=document.getElementById('v');
s.innerText="⏳ ببحث عن '"+q+"' بمدة "+(dur==0?"مفتوحة":dur+" ث")+" في كل المنصات...";

let foundId=null;
for(let api of PIPED_INSTANCES){
 try{
  let res=await fetch(api+"/search?q="+encodeURIComponent(q)+"&filter=videos");
  let data=await res.json();
  if(!data.items) continue;
  let items=data.items;
  // فلتر بالمدة
  if(dur!=0){
    items=items.filter(it=>{
      let sec=it.duration||0;
      if(dur==15) return sec>=5 && sec<=35;
      if(dur==30) return sec>=25 && sec<=45;
      if(dur==60) return sec>=50 && sec<=75;
      return true;
    });
  }
  if(items.length>0){
    foundId=items[0].url.replace("/watch?v=","");
    break;
  }
 }catch(e){console.log("API failed",api);}
}
if(foundId){
 v.src="https://www.youtube.com/embed/"+foundId+"?autoplay=1&rel=0";
 s.innerText="✅ لقيت: '"+q+"' - مدة مطابقة "+dur+"ث - فيديو: "+foundId;
}else{
 // fallback - فيديو مطابق تقريبي
 v.src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1";
 s.innerText="⚠️ ما لقيت مدة مطابقة بالضبط، جبت أقرب فيديو لـ '"+q+"' - جرب كلمة تانية";
}
}
function openTik(){window.open("https://www.tiktok.com/search?q="+encodeURIComponent(lastQuery),"_blank");}
function openFB(){window.open("https://www.facebook.com/reels/search/?q="+encodeURIComponent(lastQuery),"_blank");}
</script>
</body>
</html>
