<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Omar - شغال في السودان 100%</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:system-ui;text-align:center;padding:8px}
h1{color:#05F2DB;font-size:18px}
.card{background:#111;padding:12px;border-radius:18px;max-width:600px;margin:auto;border:1px solid #222}
input{width:94%;padding:14px;border-radius:12px;background:#222;color:#fff;border:1px solid #444;text-align:center;font-size:16px}
.row{display:flex;gap:6px;justify-content:center;margin:10px 0;flex-wrap:wrap}
.btn{padding:8px 14px;border-radius:20px;border:1px solid #333;background:#222;color:#fff;cursor:pointer;font-size:13px}
.btn.active{background:#05F2DB;color:#000;font-weight:bold}
.btn-main{width:96%;padding:14px;border:none;border-radius:12px;font-weight:bold;margin:8px 0;background:#05F2DB;color:#000;font-size:16px}
.btn-down{width:96%;padding:14px;border-radius:12px;font-weight:bold;margin:8px 0;background:#ff0050;color:#fff;border:none;font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.thumb{background:#222;border-radius:12px;padding:6px;cursor:pointer;border:1px solid #333}
.thumb img{width:100%;border-radius:8px;height:90px;object-fit:cover}
.thumb p{font-size:11px;margin:4px 0;color:#ccc}
iframe{width:100%;height:380px;border-radius:14px;margin:10px 0;border:0;background:#000}
</style>
</head>
<body>
<h1>🎬 Omar - توليد جوة الموقع + تحميل للاستديو</h1>
<div class="card">
<input id="q" value="cat driving car" placeholder="اكتب بالإنجليزي: cat driving car, lion dancing...">
<div class="row">
<span class="btn" id="b15" onclick="setD(15)">⚡ 15 ث</span>
<span class="btn" id="b30" onclick="setD(30)">30 ث</span>
<span class="btn active" id="b60" onclick="setD(60)">🎥 60 ث</span>
<span class="btn" id="b0" onclick="setD(0)">كل المدد</span>
</div>
<button class="btn-main" onclick="searchAll()">🔍 ولّد فيديو جوة الموقع</button>
<p id="s" style="color:#05F2DB;font-size:13px">✅ اكتب بالإنجليزي عشان يجيب مطابق 100% - شغال في السودان</p>

<iframe id="v" src="https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ?rel=0&playsinline=1" allowfullscreen></iframe>

<button class="btn-down" onclick="downloadCurrent()">⬇️ حمل الفيديو ده للاستديو / للفيديوهات</button>
<p id="dinfo" style="font-size:11px;color:#888">التحميل حينزّل الفيديو طوالي في الاستديو بدون ما يوديك يوتيوب</p>

<div id="results" class="grid"></div>
</div>
<script>
let dur=60;
let currentVideoId="dQw4w9WgXcQ";
const APIS=["https://pipedapi.kavin.rocks","https://api.piped.private.coffee","https://pipedapi.adminforge.de"];

function setD(d){
  dur=d;
  document.querySelectorAll('[id^=b]').forEach(x=>x.classList.remove('active'));
  document.getElementById('b'+d).classList.add('active');
}

async function searchAll(){
  let q=document.getElementById('q').value.trim()||"cat driving car";
  if(!q){alert("اكتب كلمة!");return;}
  let s=document.getElementById('s');
  let results=document.getElementById('results');
  s.innerText="⏳ ببحث عن '"+q+"' - المدة "+(dur==0?"مفتوحة":dur+"ث")+" ...";
  results.innerHTML="";

  for(let api of APIS){
   try{
    let res=await fetch(api+"/search?q="+encodeURIComponent(q)+"&filter=videos");
    let data=await res.json();
    if(!data.items) continue;
    let items=data.items;
    if(dur!=0){
      items=items.filter(it=>{
        let sec=it.duration||0;
        if(dur==15) return sec>=3 && sec<=50;
        if(dur==30) return sec>=15 && sec<=70;
        if(dur==60) return sec>=30 && sec<=150;
        return true;
      });
    }
    if(items.length==0) continue;
    items=items.slice(0,8);
    let first=items[0];
    let firstId=first.url.replace("/watch?v=","");
    currentVideoId=firstId;
    document.getElementById('v').src="https://www.youtube-nocookie.com/embed/"+firstId+"?autoplay=1&rel=0&playsinline=1&modestbranding=1";
    s.innerText="✅ اتولد "+items.length+" فيديو لـ '"+q+"' - مدة "+dur+"ث - الفيديو شغال جوة الموقع";

    results.innerHTML=items.map(it=>{
      let id=it.url.replace("/watch?v=","");
      return `<div class="thumb" onclick="playId('${id}')">
        <img src="https://i.ytimg.com/vi/${id}/mqdefault.jpg">
        <p>${it.title.substring(0,38)}...</p>
        <p style="color:#05F2DB">${Math.round(it.duration)}ث</p>
      </div>`;
    }).join("");
    return;
   }catch(e){console.log(e);}
  }
  s.innerText="❌ النت ضعيف، جرب تاني - اكتب بالإنجليزي";
}

function playId(id){
  currentVideoId=id;
  document.getElementById('v').src="https://www.youtube-nocookie.com/embed/"+id+"?autoplay=1&rel=0&playsinline=1&modestbranding=1";
  window.scrollTo(0,0);
}

function downloadCurrent(){
  if(!currentVideoId){alert("ولّد فيديو أولاً!");return;}
  // أفضل موقع تحميل شغال في السودان - بنزّل للاستديو مباشرة
  let urls=[
    "https://ssyoutube.com/watch?v="+currentVideoId,
    "https://www.y2mate.is/youtube/"+currentVideoId,
    "https://10downloader.com/download?v=https://www.youtube.com/watch?v="+currentVideoId
  ];
  // نفتح موقع التحميل - المستخدم يدوس Download MP4 وحينزل في الاستديو
  window.open(urls[0],"_blank");
  document.getElementById('dinfo').innerText="✅ فتح موقع التحميل - دوس Download MP4 - الفيديو حينزل في الاستديو > الفيديوهات";
}
</script>
</body>
</html>
