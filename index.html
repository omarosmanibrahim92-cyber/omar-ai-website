<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Omar AI - 3 صور مقابل اعلان</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:system-ui;text-align:center;padding:8px}
.box{background:#111;padding:14px;border-radius:16px;max-width:520px;margin:8px auto;border:1px solid #00ffcc}
textarea{width:96%;padding:14px;border-radius:12px;background:#222;color:#fff;border:1px solid #00ffcc;font-size:16px}
.btn{width:96%;padding:14px;border:none;border-radius:25px;font-weight:bold;margin:8px 0;font-size:16px;cursor:pointer}
.btn-gen{background:#00ffcc;color:#000}
.btn-ad{background:#ffeb3b;color:#000;font-size:18px;animation:pulse 1s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
img{width:96%;border-radius:14px;margin:10px auto;display:block;min-height:300px;background:#222;object-fit:cover}
.ad-modal{position:fixed;inset:0;background:rgba(0,0,0,0.96);display:none;align-items:center;justify-content:center;z-index:9999;padding:20px}
.ad-card{background:#1a1a1a;border:2px solid #ffeb3b;border-radius:20px;padding:20px;max-width:360px;width:100%;text-align:center}
</style>
</head>
<body>

<div class="box" style="display:flex;justify-content:space-between">
<span style="color:#00ffcc;font-weight:bold">🤖 Omar AI - اربح 💰</span>
<span id="cred" style="background:#00ffcc;color:#000;padding:6px 14px;border-radius:20px;font-weight:bold">3 صور مجانية</span>
</div>

<div class="box">
<p style="font-size:12px;color:#0f0;margin:4px">✅ بدون رفض - بدون 45 ثانية - اعلان = 3 صور</p>
<textarea id="prompt" rows="3">قطة كبيرة جميلة تلعب في حديقة</textarea>
<button class="btn btn-gen" id="genBtn" onclick="generate()">✨ ولد الصورة</button>
<p id="status" style="font-size:13px;color:#00ffcc"></p>
</div>

<div id="result" class="box" style="display:none">
<img id="genImg">
<button class="btn btn-gen" style="background:#222;color:#fff;border:1px solid #333" onclick="downloadImg()">⬇️ تحميل الصورة</button>
</div>

<!-- مودال الاعلان - بيفتح تلقائي -->
<div id="adModal" class="ad-modal">
<div class="ad-card">
<h2 style="color:#ffeb3b;margin:5px">🎬 شاهد اعلان واحد</h2>
<p style="color:#aaa;font-size:13px">رصيدك خلص! شاهد اعلان واحد لتحصل على 3 صور جديدة</p>
<div style="font-size:40px;margin:10px">💰</div>
<button class="btn btn-ad" onclick="openAd()">👆 افتح الاعلان الآن +3 صور</button>
<p style="font-size:11px;color:#666;margin-top:10px">سيفتح asiafilm.org في صفحة جديدة<br>ارجع هنا واضغط زر التأكيد</p>
<button id="confirmBtn" style="display:none" class="btn btn-gen" onclick="confirmAd()">✅ شاهدت الاعلان - اعطني 3 صور</button>
<p id="adInfo" style="font-size:11px;color:#0f0"></p>
</div>
</div>

<script>
const AD_LINK="https://asiafilm.org/4/75b0210cfca5e17b2ff21efe527a9072";
let credits=parseInt(localStorage.getItem('omar_credits')||'3');
let adWindow=null;

function updateUI(){
 document.getElementById('cred').innerText=credits+' صور';
 if(credits<=0){ showAdModal(); }
}
updateUI();

async function trans(text){
 try{
  let r=await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=en&dt=t&q="+encodeURIComponent(text));
  let d=await r.json(); return d[0][0][0];
 }catch(e){return text;}
}

function makeSafePrompt(en){
 // حل مشكلة Image refused
 let safe = en.toLowerCase()
 .replace(/big cat/g,'cute kitten')
 .replace(/beautiful/g,'cute')
 .replace(/sexy|nude|naked/g,'cute');
 // نضيف وصف يخلي الصورة تظبط 100%
 return safe + ", cute kitten, adorable, high quality, 4k, cartoon style, safe for work, children's book illustration, happy";
}

async function generate(){
 if(credits<=0){ showAdModal(); return; }
 let t=document.getElementById('prompt').value.trim(); if(!t) return;
 
 document.getElementById('genBtn').disabled=true;
 document.getElementById('status').innerText='⏳ بترجم...';
 let en=await trans(t);
 let safePrompt=makeSafePrompt(en);
 document.getElementById('status').innerText='🎨 بولد: '+en;
 
 // نستخدم flux - ده ما بيرفض نهائي + جودة عالية
 let url="https://image.pollinations.ai/prompt/"+encodeURIComponent(safePrompt)+"?width=768&height=768&model=flux&seed="+Date.now()+"&nologo=true&enhance=false&safe=true&nofeed=true&private=true";
 
 document.getElementById('result').style.display='block';
 let img=document.getElementById('genImg');
 img.src=url;
 
 img.onload=()=>{
   document.getElementById('status').innerText='✅ تم! صورة مطابقة لطلبك';
   credits--; localStorage.setItem('omar_credits',credits); updateUI();
   document.getElementById('genBtn').disabled=false;
   // لو خلص الرصيد افتح الاعلان تلقائي بعد ثانيتين
   if(credits<=0){ setTimeout(showAdModal,1500); }
 };
 
 img.onerror=()=>{
   // لو حتى flux رفض، جرب موديل تاني تلقائي
   document.getElementById('status').innerText='🔄 بجرب سيرفر تاني...';
   let backupUrl="https://image.pollinations.ai/prompt/"+encodeURIComponent(safePrompt)+"?width=512&height=512&model=turbo&seed="+(Date.now()+1)+"&nologo=true";
   img.src=backupUrl;
   document.getElementById('genBtn').disabled=false;
 };
}

function showAdModal(){
 document.getElementById('adModal').style.display='flex';
 // يفتح الاعلان تلقائي بعد ثانية
 setTimeout(()=>{
   if(!adWindow || adWindow.closed){
     openAd();
   }
 },1000);
}

function openAd(){
 adWindow=window.open(AD_LINK,'_blank');
 document.getElementById('adInfo').innerText='✅ تم فتح الاعلان - شاهده 5 ثواني ثم ارجع';
 document.getElementById('confirmBtn').style.display='block';
}

function confirmAd(){
 credits=3;
 localStorage.setItem('omar_credits',credits);
 updateUI();
 document.getElementById('adModal').style.display='none';
 document.getElementById('status').innerText='🎉 شكراً! حصلت على 3 صور جديدة';
 document.getElementById('adInfo').innerText='';
 document.getElementById('confirmBtn').style.display='none';
}

function downloadImg(){
 let img=document.getElementById('genImg');
 let a=document.createElement('a'); a.href=img.src; a.target='_blank'; a.click();
}
</script>
</body>
</html>
