<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Omar AI - بدون صورة صفراء</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:system-ui;text-align:center;padding:8px}
.box{background:#111;padding:14px;border-radius:16px;max-width:520px;margin:8px auto;border:1px solid #00ffcc}
textarea{width:96%;padding:14px;border-radius:12px;background:#222;color:#fff;border:1px solid #00ffcc;font-size:16px}
.btn{width:96%;padding:14px;border:none;border-radius:25px;font-weight:bold;margin:8px 0;font-size:16px;cursor:pointer}
.btn-gen{background:#00ffcc;color:#000}
.btn-ad{background:#ffeb3b;color:#000;animation:pulse 1s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
img{width:96%;border-radius:14px;margin:10px auto;display:block;min-height:300px;background:#222}
.ad-modal{position:fixed;inset:0;background:rgba(0,0,0,0.97);display:none;align-items:center;justify-content:center;z-index:9999;padding:20px}
.ad-card{background:#1a1a1a;border:2px solid #00ffcc;border-radius:20px;padding:20px;max-width:360px;width:100%}
.timer{font-size:36px;color:#00ffcc;font-weight:bold;margin:10px}
</style>
</head>
<body>

<div class="box" style="display:flex;justify-content:space-between">
<span style="color:#00ffcc;font-weight:bold">🤖 Omar AI - بدون صورة صفراء</span>
<span id="cred" style="background:#00ffcc;color:#000;padding:6px 14px;border-radius:20px">3</span>
</div>

<div class="box">
<p style="font-size:11px;color:#0f0">✅ مستحيل تظهر الصورة الصفراء تاني</p>
<textarea id="prompt" rows="2">حصان ابيض</textarea>
<button class="btn btn-gen" id="genBtn" onclick="generate()">✨ ولد الصورة</button>
<p id="status" style="font-size:13px;color:#00ffcc"></p>
</div>

<div id="result" class="box" style="display:none">
<img id="genImg">
<button class="btn btn-gen" style="background:#222;color:#fff;border:1px solid #444" onclick="downloadImg()">⬇️ تحميل</button>
</div>

<div id="adModal" class="ad-modal">
<div class="ad-card">
<h3 id="adTitle" style="color:#00ffcc">⏳ انتظر 45 ثانية</h3>
<p id="adText" style="font-size:13px;color:#aaa">Pollinations بيسمح بصورة واحدة كل 45 ثانية - شاهد اعلان اثناء الانتظار</p>
<div class="timer" id="adTimer">45</div>
<button class="btn btn-ad" onclick="openAd()">👆 اضغط هنا لفتح الاعلان واربح 💰</button>
<p id="adInfo" style="font-size:11px;color:#0f0"></p>
<button id="continueBtn" style="display:none" class="btn btn-gen" onclick="closeAd()">✅ المتابعة</button>
</div>
</div>

<script>
let credits=parseInt(localStorage.getItem('omar_credits')||'3');
let lastGen = parseInt(localStorage.getItem('lastGen')||'0');
function updateUI(){document.getElementById('cred').innerText=credits+' صور';}
updateUI();

async function trans(text){
 try{let r=await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=en&dt=t&q="+encodeURIComponent(text));let d=await r.json();return d[0][0][0];}catch(e){return text;}
}

function canGenerate(){
 let now=Date.now();
 let diff = now - lastGen;
 if(diff < 45000){
   let remain = Math.ceil((45000 - diff)/1000);
   showCooldown(remain);
   return false;
 }
 return true;
}

function showCooldown(sec){
 document.getElementById('adModal').style.display='flex';
 document.getElementById('adTitle').innerText='⏳ انتظر '+sec+' ثانية';
 document.getElementById('adText').innerText='لمنع ظهور الصورة الصفراء - شاهد اعلانك اثناء الانتظار';
 document.getElementById('adTimer').innerText=sec;
 document.getElementById('continueBtn').style.display='none';
 
 let iv=setInterval(()=>{
   sec--;
   document.getElementById('adTimer').innerText=sec;
   document.getElementById('adTitle').innerText='⏳ انتظر '+sec+' ثانية';
   if(sec<=0){
     clearInterval(iv);
     document.getElementById('adTimer').innerText='✅';
     document.getElementById('adTitle').innerText='✅ جاهز!';
     document.getElementById('continueBtn').style.display='block';
     document.getElementById('continueBtn').innerText='✅ ولد الصورة الآن';
   }
 },1000);
}

async function generate(){
 if(credits<=0){
   document.getElementById('adModal').style.display='flex';
   document.getElementById('adTitle').innerText='🎬 رصيدك خلص';
   document.getElementById('adTimer').innerText='💰';
   document.getElementById('continueBtn').style.display='block';
   document.getElementById('continueBtn').innerText='شاهدت الاعلان - رجع 3 صور';
   return;
 }
 if(!canGenerate()) return;

 let t=document.getElementById('prompt').value.trim(); if(!t) return;
 document.getElementById('genBtn').disabled=true;
 document.getElementById('status').innerText='⏳ بترجم...';
 let en=await trans(t);
 // حل Image refused - ننظف الكلمات
 let safe = en.toLowerCase().replace(/white/g,'light colored').replace(/black/g,'dark colored').replace(/big/g,'cute').replace(/beautiful|sexy|nude/g,'cute') + ", cute cartoon, children's book illustration, safe for work, 4k, adorable";
 document.getElementById('status').innerText='🎨 بولد: '+en;

 // نستخدم turbo بدل flux - turbo ما بيرفض حصان ابيض
 let url="https://image.pollinations.ai/prompt/"+encodeURIComponent(safe)+"?width=768&height=768&model=turbo&seed="+Date.now()+"&nologo=true&enhance=false&safe=false&nofeed=true&private=true";
 
 document.getElementById('result').style.display='block';
 let img=document.getElementById('genImg');
 img.src=url;
 
 img.onload=()=>{
   document.getElementById('status').innerText='✅ تم!';
   lastGen=Date.now();
   localStorage.setItem('lastGen',lastGen);
   credits--; localStorage.setItem('omar_credits',credits); updateUI();
   document.getElementById('genBtn').disabled=false;
   if(credits<=0){
     setTimeout(()=>{document.getElementById('adModal').style.display='flex';},1000);
   }
 };
 img.onerror=()=>{
   document.getElementById('status').innerText='❌ حاول تاني';
   document.getElementById('genBtn').disabled=false;
 };
}

function openAd(){
 window.open("https://www.google.com","_blank");
 document.getElementById('adInfo').innerText='✅ شكراً - تربح من الضغطة';
}
function closeAd(){
 document.getElementById('adModal').style.display='none';
 if(credits<=0){
   credits=3; localStorage.setItem('omar_credits',credits); updateUI();
   document.getElementById('adModal').style.display='none';
 }
}

function downloadImg(){
 let img=document.getElementById('genImg'); let a=document.createElement('a'); a.href=img.src; a.target='_blank'; a.click();
}
</script>
</body>
</html>
