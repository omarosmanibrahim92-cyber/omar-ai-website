<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Omar AI</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:system-ui;text-align:center;padding:8px}
.box{background:#111;padding:12px;border-radius:14px;max-width:520px;margin:8px auto}
textarea{width:96%;padding:12px;border-radius:10px;background:#222;color:#fff;border:1px solid #00ffcc}
.btn{width:96%;padding:13px;border:none;border-radius:25px;font-weight:bold;margin:6px}
.btn-gen{background:#00ffcc;color:#000}
img{width:96%;border-radius:12px;margin:10px auto;display:block;min-height:250px;background:#111}
</style>
</head>
<body>
<div class="box" style="display:flex;justify-content:space-between">
<span style="color:#00ffcc">🤖 Omar AI</span>
<span id="cred" style="background:#00ffcc;color:#000;padding:4px 10px;border-radius:12px">3 صور</span>
</div>

<div class="box">
<p style="font-size:11px;color:#888">كل اللغات 🌍</p>
<textarea id="prompt" rows="2">قطة جميلة</textarea>
<button class="btn btn-gen" id="genBtn" onclick="generate()">✨ ولد الصورة</button>
<p id="status" style="font-size:12px;color:#00ffcc"></p>
<p id="cd" style="color:#ffeb3b;font-size:12px"></p>
</div>

<div id="result"></div>

<div id="adBox" style="display:none" class="box">
<button class="btn btn-gen" onclick="window.open('https://asiafilm.org/4/75b0210cfca5e17b2ff21efe527a9072','_blank'); credits=3; localStorage.setItem('omar_credits',3); updateUI();">👆 افتح الاعلان +3 صور</button>
</div>

<div style="font-size:10px;color:#555;padding:10px"><a href="#" onclick="document.getElementById('pp').style.display='block';return false" style="color:#00ffcc">سياسة الخصوصية</a><div id="pp" style="display:none;text-align:right;background:#111;padding:8px;border-radius:8px">لا نجمع بيانات. التوليد عبر Pollinations. الاعلان بموافقتك.</div></div>

<script>
const AD_LINK="https://asiafilm.org/4/75b0210cfca5e17b2ff21efe527a9072";
let credits=parseInt(localStorage.getItem('omar_credits')||'3');
let canGen=true;
let retryCount=0;

function updateUI(){document.getElementById('cred').innerText=credits+' صور';}
updateUI();

async function trans(text){
 try{
  let r=await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=en&dt=t&q="+encodeURIComponent(text));
  let d=await r.json(); return d[0][0][0];
 }catch(e){return text;}
}

function cooldown(){
 canGen=false; let s=45;
 let iv=setInterval(()=>{
  s--; document.getElementById('cd').innerText='⏳ انتظر '+s+' ثانية';
  if(s<=0){clearInterval(iv); canGen=true; document.getElementById('cd').innerText='✅ جاهز'; document.getElementById('genBtn').disabled=false;}
 },1000);
}

function safePrompt(text){
 // نحذف الكلمات البترفضها الفلتر
 return text.replace(/beautiful|sexy|nude|naked/gi,'cute')
 + ", cute animal, high quality, 4k, cartoon style, safe for work";
}

async function generate(){
 if(!canGen) return;
 if(credits<=0){document.getElementById('adBox').style.display='block'; return;}
 let t=document.getElementById('prompt').value.trim();
 if(!t) return;
 
 document.getElementById('status').innerText='⏳ بترجم...';
 let en=await trans(t);
 let safe = safePrompt(en);
 document.getElementById('status').innerText='🎨 '+en;
 
 credits--; localStorage.setItem('omar_credits',credits); updateUI();
 
 // جرب 3 سيرفرات مختلفة - لو واحد رفض التاني يشتغل
 let models = ['flux','turbo','kontext'];
 let model = models[retryCount % 3];
 retryCount++;
 
 let url="https://image.pollinations.ai/prompt/"+encodeURIComponent(safe)+"?width=512&height=512&nologo=true&model="+model+"&seed="+Date.now()+"&enhance=false&safe=true";
 
 document.getElementById('result').innerHTML='<img id="genImg" src="'+url+'" onload="document.getElementById(\'status\').innerText=\'✅ تم!\'" onerror="handleError()">'+
 '<br><button class="btn btn-gen" onclick="retry()">🔄 جرب سيرفر تاني</button>';
 
 document.getElementById('genBtn').disabled=true;
 cooldown();
}

function handleError(){
 document.getElementById('status').innerText='⚠️ السيرفر رفض، بجرب سيرفر تاني...';
 setTimeout(()=>{generate(); credits++; localStorage.setItem('omar_credits',credits);}, 1000);
}

function retry(){
 credits++; localStorage.setItem('omar_credits',credits); updateUI();
 generate();
}
</script>
</body>
</html>
