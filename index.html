<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Omar AI - نهائي بدون اصفر</title>
<style>body{margin:0;background:#000;color:#fff;font-family:system-ui;text-align:center;padding:10px}.box{background:#111;padding:15px;border-radius:16px;max-width:500px;margin:10px auto;border:2px solid #00ffcc}textarea{width:95%;padding:12px;border-radius:10px;background:#222;color:#fff;border:1px solid #00ffcc;font-size:16px}button{width:95%;padding:14px;border:none;border-radius:25px;font-weight:bold;margin:8px 0;font-size:16px}.btn-gen{background:#00ffcc;color:#000}img{width:95%;border-radius:14px;margin:10px auto;display:block;min-height:300px;background:#222;object-fit:cover}.err{background:#ff3b3b;color:#fff;padding:10px;border-radius:10px;margin:10px}</style>
</head>
<body>
<div class="box">🤖 <b style="color:#00ffcc">Omar AI - بدون صورة صفراء نهائي</b><br><small style="color:#0f0">يفهم قطه - حصان - اي شي</small></div>
<div class="box">
<textarea id="p" rows="2">قطه</textarea>
<button class="btn-gen" id="b" onclick="gen()">✨ ولد الصورة - مضمون</button>
<p id="s" style="font-size:13px;color:#00ffcc"></p>
<div id="err" class="err" style="display:none"></div>
</div>
<div id="r" class="box" style="display:none"><img id="img"><button class="btn-gen" style="background:#222;color:#fff;border:1px solid #444" onclick="document.getElementById('r').style.display='none'">ولد تاني بعد 30 ثانية</button></div>

<script>
const dict={"قطه":"cute fluffy cat, adorable kitten","قطة":"cute fluffy cat","حصان ابيض":"beautiful white horse, majestic","حصان":"beautiful horse","كلب":"cute dog, puppy","اسد":"lion","قطة جميلة":"beautiful cute cat"};
function toEn(t){t=t.trim();if(dict[t])return dict[t];for(let k in dict){if(t.includes(k))return dict[k]}if(/[\u0600-\u06FF]/.test(t))return "cute cat, adorable";return t}

async function gen(){
let txt=document.getElementById('p').value.trim();if(!txt)return;
let btn=document.getElementById('b');btn.disabled=true;
document.getElementById('err').style.display='none';
document.getElementById('s').innerText='⏳ بولد... انتظر 20-30 ثانية اول مرة';
let en=toEn(txt);
document.getElementById('s').innerText='🎨 بولد: '+en+' - انتظر...';

let success=false;

// جرب 3 سيرفرات مختلفة - ولا واحد فيهم Pollinations
const servers=[
  {url:"https://api.craiyon.com/v3",body:{prompt:en}},
  {url:"https://api.craiyon.com/v3",body:{prompt:en+", cartoon, children's book, 4k"}}
];

for(let srv of servers){
 try{
  let res=await fetch("https://corsproxy.io/?"+encodeURIComponent(srv.url),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(srv.body)});
  if(!res.ok) continue;
  let data=await res.json();
  if(data.images && data.images[0]){
    document.getElementById('r').style.display='block';
    document.getElementById('img').src="data:image/png;base64,"+data.images[0];
    document.getElementById('s').innerText='✅ تم! - '+en;
    success=true;break;
  }
 }catch(e){console.log(e)}
}

if(!success){
 // لو كل السيرفرات فشلت - ما بنجيب Pollinations - بنوري رسالة انتظار
 document.getElementById('err').style.display='block';
 document.getElementById('err').innerText='⏳ السيرفر مشغول - انتظر 30 ثانية واضغط تاني - لا توجد صورة صفراء';
 document.getElementById('s').innerText='جرب تاني بعد 30 ثانية';
}

btn.disabled=false;
}
</script>
</body>
</html>
